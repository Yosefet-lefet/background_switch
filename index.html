<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9c4b38" />
    <link rel="icon" type="image/gif" href="./favicon.gif" />
    <title></title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
      }

      .canvas {
        min-height: 100svh;
        background-color: #9c4b38;
        cursor: pointer;
        touch-action: none;
        user-select: none;
      }

      .color-cursor {
        position: fixed;
        z-index: 3;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition: background-color 250ms linear, opacity 120ms ease;
      }

      .color-cursor.is-visible {
        opacity: 1;
      }

      .cursor-trail {
        position: fixed;
        z-index: 2;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
        animation: trail-fade 1000ms ease-out forwards;
      }

      @keyframes trail-fade {
        from {
          opacity: 0.9;
          transform: translate(-50%, -50%) scale(1);
        }

        to {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.25);
        }
      }

      .cursor-face {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .has-smile .cursor-face {
        opacity: 1;
      }

      .cursor-eye {
        position: absolute;
        top: 25%;
        width: 10%;
        height: 10%;
        border-radius: 50%;
        background: #171717;
      }

      .cursor-eye:first-child {
        left: 30%;
      }

      .cursor-eye:nth-child(2) {
        right: 30%;
      }

      .cursor-smile {
        position: absolute;
        top: 47.5%;
        left: 27.5%;
        width: 45%;
        height: 22.5%;
        border: 1px solid #171717;
        border-top: 0;
        border-radius: 0 0 50% 50%;
      }

      .color-reveal {
        position: fixed;
        z-index: 1;
        border-radius: 50%;
        pointer-events: none;
      }

      .color-explosion {
        position: fixed;
        z-index: 4;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .explosion-particle {
        position: absolute;
        top: var(--origin-y);
        left: var(--origin-x);
        width: var(--particle-size);
        height: var(--particle-size);
        border-radius: 50%;
        animation: color-burst var(--burst-duration)
          cubic-bezier(0.12, 0.72, 0.3, 1) var(--burst-delay) forwards;
      }

      .color-explosion.is-static .explosion-particle {
        opacity: 0.8;
        animation: none;
      }

      @keyframes color-burst {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.15);
        }

        to {
          opacity: 0;
          transform: translate(
              calc(-50% + var(--burst-x)),
              calc(-50% + var(--burst-y))
            )
            scale(1.5);
        }
      }

      @media (hover: hover) and (pointer: fine) {
        .canvas {
          cursor: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }

        .color-cursor,
        .cursor-face {
          transition-duration: 0.01ms;
        }

        .cursor-trail {
          animation-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <main class="canvas" id="canvas">
      <div class="color-cursor" id="color-cursor" aria-hidden="true">
        <span class="cursor-face">
          <span class="cursor-eye"></span>
          <span class="cursor-eye"></span>
          <span class="cursor-smile"></span>
        </span>
      </div>
    </main>

    <script>
      const canvas = document.querySelector("#canvas");
      const colorCursor = document.querySelector("#color-cursor");
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const favicon = document.querySelector('link[rel="icon"]');
      const faviconCanvas = document.createElement("canvas");
      const faviconContext = faviconCanvas.getContext("2d");
      faviconCanvas.width = 32;
      faviconCanvas.height = 32;
      let activeReveal;
      let activeTouchPointerId;
      let lastTrailPoint;
      let cursorSize = 8;
      let isExploding = false;
      const trailMarks = new Set();

      function drawFavicon(hue) {
        faviconContext.clearRect(0, 0, faviconCanvas.width, faviconCanvas.height);
        faviconContext.fillStyle = `hsl(${hue} 72% 55%)`;
        faviconContext.beginPath();
        faviconContext.arc(16, 16, 14, 0, Math.PI * 2);
        faviconContext.fill();
        favicon.type = "image/png";
        favicon.href = faviconCanvas.toDataURL("image/png");
        colorCursor.style.backgroundColor = `hsl(${hue} 72% 55%)`;
      }

      let faviconStartHue = Math.random() * 360;
      let faviconTargetHue = Math.random() * 360;
      let faviconTransitionStarted = performance.now();
      let faviconTransitionDuration = 3500;

      drawFavicon(faviconStartHue);
      window.setInterval(() => {
        const now = performance.now();
        const progress = Math.min(
          (now - faviconTransitionStarted) / faviconTransitionDuration,
          1,
        );
        const hueDifference = ((faviconTargetHue - faviconStartHue + 540) % 360) - 180;
        const easedProgress = progress * progress * (3 - 2 * progress);
        drawFavicon((faviconStartHue + hueDifference * easedProgress + 360) % 360);

        if (progress === 1) {
          faviconStartHue = faviconTargetHue;
          faviconTargetHue = Math.random() * 360;
          faviconTransitionStarted = now;
          faviconTransitionDuration = 3000 + Math.random() * 3000;
        }
      }, 250);

      function toHex(hue, saturation, lightness) {
        const s = saturation / 100;
        const l = lightness / 100;
        const chroma = (1 - Math.abs(2 * l - 1)) * s;
        const x = chroma * (1 - Math.abs(((hue / 60) % 2) - 1));
        const offset = l - chroma / 2;
        const segments = [
          [chroma, x, 0],
          [x, chroma, 0],
          [0, chroma, x],
          [0, x, chroma],
          [x, 0, chroma],
          [chroma, 0, x],
        ];
        const [red, green, blue] = segments[Math.floor(hue / 60)].map((value) =>
          Math.round((value + offset) * 255),
        );
        return `#${[red, green, blue]
          .map((channel) => channel.toString(16).padStart(2, "0"))
          .join("")}`;
      }

      function updateColor(event) {
        if (isExploding) return;

        cursorSize += 3;
        colorCursor.style.width = `${cursorSize}px`;
        colorCursor.style.height = `${cursorSize}px`;
        const styledX = Number.parseFloat(colorCursor.style.left);
        const styledY = Number.parseFloat(colorCursor.style.top);
        const cursorX = Number.isFinite(styledX) ? styledX : event.clientX;
        const cursorY = Number.isFinite(styledY) ? styledY : event.clientY;
        const farthestCorner = Math.max(
          Math.hypot(cursorX, cursorY),
          Math.hypot(window.innerWidth - cursorX, cursorY),
          Math.hypot(cursorX, window.innerHeight - cursorY),
          Math.hypot(
            window.innerWidth - cursorX,
            window.innerHeight - cursorY,
          ),
        );

        if (cursorSize >= farthestCorner * 2) {
          startColorExplosion();
          return;
        }

        const isPastel = Math.random() < 0.35;
        const hue = Math.floor(Math.random() * 360);
        const saturation = isPastel
          ? 45 + Math.floor(Math.random() * 31)
          : 52 + Math.floor(Math.random() * 25);
        const lightness = isPastel
          ? 78 + Math.floor(Math.random() * 13)
          : 42 + Math.floor(Math.random() * 25);
        const color = toHex(hue, saturation, lightness);
        const cssColor = `hsl(${hue} ${saturation}% ${lightness}%)`;
        themeColor.setAttribute("content", color);

        if (activeReveal) {
          canvas.style.backgroundColor = activeReveal.cssColor;
          activeReveal.animation.cancel();
          activeReveal.element.remove();
          activeReveal = undefined;
        }

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          canvas.style.backgroundColor = cssColor;
          return;
        }

        const x = event.clientX;
        const y = event.clientY;
        const radius = Math.hypot(
          Math.max(x, window.innerWidth - x),
          Math.max(y, window.innerHeight - y),
        );
        const reveal = document.createElement("div");
        reveal.className = "color-reveal";
        reveal.style.backgroundColor = cssColor;
        reveal.style.width = `${radius * 2}px`;
        reveal.style.height = `${radius * 2}px`;
        reveal.style.left = `${x - radius}px`;
        reveal.style.top = `${y - radius}px`;
        document.body.append(reveal);

        const animation = reveal.animate(
          [
            { transform: "scale(0.0005)" },
            { transform: "scale(1)" },
          ],
          { duration: 750, easing: "ease-out" },
        );
        const revealState = { animation, cssColor, element: reveal };
        activeReveal = revealState;
        animation.onfinish = () => {
          if (activeReveal !== revealState) return;
          canvas.style.backgroundColor = cssColor;
          reveal.remove();
          activeReveal = undefined;
        };
      }

      function startColorExplosion() {
        isExploding = true;
        colorCursor.classList.remove("is-visible", "has-smile");
        const explosion = document.createElement("div");
        explosion.className = "color-explosion";
        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        const burstCount = 9;
        const particlesPerBurst = 32;
        const screenDiagonal = Math.hypot(window.innerWidth, window.innerHeight);

        for (let burst = 0; burst < burstCount; burst += 1) {
          const burstColumn = burst % 3;
          const burstRow = Math.floor(burst / 3);
          const burstOriginX = burstColumn * (100 / 3) + 12 + Math.random() * 10;
          const burstOriginY = burstRow * (100 / 3) + 12 + Math.random() * 10;

          for (
            let particleIndex = 0;
            particleIndex < particlesPerBurst;
            particleIndex += 1
          ) {
            const angle =
              (particleIndex / particlesPerBurst) * Math.PI * 2 +
              (Math.random() - 0.5) * 0.24;
            const distance = screenDiagonal * (0.2 + Math.random() * 0.42);
            const particle = document.createElement("div");
            const hue =
              (particleIndex * (360 / particlesPerBurst) +
                burst * 19 +
                Math.random() * 14) %
              360;
            particle.className = "explosion-particle";
            particle.style.backgroundColor = `hsl(${hue} ${
              72 + Math.random() * 28
            }% ${48 + Math.random() * 24}%)`;
            particle.style.setProperty(
              "--origin-x",
              `${reducedMotion ? 5 + Math.random() * 90 : burstOriginX}%`,
            );
            particle.style.setProperty(
              "--origin-y",
              `${reducedMotion ? 5 + Math.random() * 90 : burstOriginY}%`,
            );
            particle.style.setProperty("--particle-size", `${9 + Math.random() * 23}px`);
            particle.style.setProperty("--burst-x", `${Math.cos(angle) * distance}px`);
            particle.style.setProperty("--burst-y", `${Math.sin(angle) * distance}px`);
            particle.style.setProperty(
              "--burst-delay",
              `${burst * 300}ms`,
            );
            particle.style.setProperty(
              "--burst-duration",
              `${1700 + Math.random() * 700}ms`,
            );

            if (reducedMotion) {
              explosion.classList.add("is-static");
            }

            explosion.append(particle);
          }
        }

        document.body.append(explosion);
        window.setTimeout(() => {
          explosion.remove();
          cursorSize = 8;
          colorCursor.style.width = "8px";
          colorCursor.style.height = "8px";
          isExploding = false;
        }, 5000);
      }

      function positionCursor(event) {
        const touchOffset = event.pointerType === "touch" ? 50 : 0;
        colorCursor.style.left = `${event.clientX}px`;
        colorCursor.style.top = `${event.clientY - touchOffset}px`;
        colorCursor.classList.add("is-visible");
      }

      function leaveTrail(event) {
        if (
          event.pointerType === "touch" &&
          event.pointerId !== activeTouchPointerId
        ) {
          return;
        }

        const point = { x: event.clientX, y: event.clientY };
        if (
          lastTrailPoint &&
          Math.hypot(point.x - lastTrailPoint.x, point.y - lastTrailPoint.y) < 12
        ) {
          return;
        }
        lastTrailPoint = point;

        const [red, green, blue] = getComputedStyle(canvas)
          .backgroundColor.match(/\d+(?:\.\d+)?/g)
          .slice(0, 3)
          .map(Number);
        const mark = document.createElement("div");
        mark.className = "cursor-trail";
        mark.style.backgroundColor = `rgb(${255 - red} ${255 - green} ${255 - blue})`;
        mark.style.left = `${point.x}px`;
        mark.style.top = `${point.y}px`;
        document.body.append(mark);
        trailMarks.add(mark);

        if (trailMarks.size > 80) {
          const oldestMark = trailMarks.values().next().value;
          oldestMark.remove();
          trailMarks.delete(oldestMark);
        }

        mark.addEventListener(
          "animationend",
          () => {
            trailMarks.delete(mark);
            mark.remove();
          },
          { once: true },
        );
      }

      canvas.addEventListener("pointermove", (event) => {
        positionCursor(event);
        leaveTrail(event);
      });
      canvas.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") {
          activeTouchPointerId = event.pointerId;
          lastTrailPoint = undefined;
          canvas.setPointerCapture(event.pointerId);
        }
        positionCursor(event);
        colorCursor.classList.add("has-smile");
      });
      function endPointer(event) {
        colorCursor.classList.remove("has-smile");
        if (event.pointerType === "touch" && event.pointerId === activeTouchPointerId) {
          activeTouchPointerId = undefined;
          lastTrailPoint = undefined;
          colorCursor.classList.remove("is-visible");
        }
      }

      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);
      canvas.addEventListener("pointerleave", (event) => {
        if (event.pointerType === "touch" && event.pointerId === activeTouchPointerId) return;
        lastTrailPoint = undefined;
        colorCursor.classList.remove("is-visible");
        colorCursor.classList.remove("has-smile");
      });
      canvas.addEventListener("click", updateColor);
    </script>
  </body>
</html>
