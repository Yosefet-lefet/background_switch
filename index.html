<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9c4b38" />
    <link rel="icon" type="image/gif" href="./favicon.gif" />
    <title></title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
      }

      .canvas {
        min-height: 100svh;
        background-color: #9c4b38;
        cursor: pointer;
        touch-action: none;
        user-select: none;
      }

      .color-cursor {
        position: fixed;
        z-index: 3;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition: background-color 250ms linear, opacity 120ms ease;
      }

      .color-cursor.is-visible {
        opacity: 1;
      }

      .cursor-trail {
        position: fixed;
        z-index: 2;
        width: var(--trail-size);
        height: var(--trail-size);
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
        animation: trail-fade 1600ms ease-out forwards;
      }

      @keyframes trail-fade {
        from {
          opacity: 0.9;
          transform: translate(-50%, -50%) scale(1);
        }

        to {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.08);
        }
      }

      @keyframes trail-fade-reduced {
        from {
          opacity: 0.9;
        }

        to {
          opacity: 0;
        }
      }

      .cursor-face {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .has-smile .cursor-face {
        opacity: 1;
      }

      .has-selfie .cursor-face {
        opacity: 1;
      }

      .cursor-selfie {
        display: none;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        transform: scaleX(-1);
      }

      .has-selfie .cursor-selfie {
        display: block;
      }

      .has-selfie .cursor-eye,
      .has-selfie .cursor-smile {
        display: none;
      }

      .camera-status {
        position: fixed;
        z-index: 5;
        right: 16px;
        bottom: 16px;
        left: 16px;
        width: fit-content;
        max-width: calc(100vw - 32px);
        margin: 0 auto;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgb(0 0 0 / 75%);
        color: #fff;
        font: 14px/1.4 system-ui, sans-serif;
        opacity: 0;
        pointer-events: none;
        transition: opacity 150ms ease;
      }

      .camera-status.is-visible {
        opacity: 1;
      }

      .cursor-eye {
        position: absolute;
        top: 25%;
        width: 10%;
        height: 10%;
        border-radius: 50%;
        background: #171717;
      }

      .cursor-eye:first-child {
        left: 30%;
      }

      .cursor-eye:nth-child(2) {
        right: 30%;
      }

      .cursor-smile {
        position: absolute;
        top: 47.5%;
        left: 27.5%;
        width: 45%;
        height: 22.5%;
        border: 1px solid #171717;
        border-top: 0;
        border-radius: 0 0 50% 50%;
      }

      .color-reveal {
        position: fixed;
        z-index: 1;
        border-radius: 50%;
        pointer-events: none;
      }

      .color-explosion {
        position: fixed;
        z-index: 4;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .color-explosion::before {
        position: absolute;
        inset: -25%;
        background: conic-gradient(
          #ff1744,
          #ff9100,
          #ffea00,
          #00e676,
          #00e5ff,
          #2979ff,
          #d500f9,
          #ff1744
        );
        content: "";
        filter: blur(80px);
        opacity: 0.08;
        animation: celebration-glow 2.4s ease-in-out infinite alternate;
      }

      .color-explosion::after {
        position: absolute;
        z-index: 1;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          rgb(8 3 28 / 38%),
          rgb(8 3 28 / 72%)
        );
        content: "";
        animation: celebration-night 700ms ease-out both;
      }

      .firework-burst {
        position: absolute;
        z-index: 2;
        top: var(--origin-y);
        left: var(--origin-x);
        width: 0;
        height: 0;
      }

      .firework-ring {
        position: absolute;
        top: 0;
        left: 0;
        width: 150vmax;
        height: 150vmax;
        border: 8px solid var(--burst-color);
        border-radius: 50%;
        box-shadow:
          0 0 24px 8px var(--burst-color),
          inset 0 0 24px 8px var(--burst-color);
        transform: translate(-50%, -50%) scale(0.01);
        animation: ring-burst 2200ms cubic-bezier(0.12, 0.72, 0.3, 1)
          var(--burst-delay) both;
      }

      .explosion-particle {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--particle-size);
        height: var(--particle-size);
        border-radius: 50%;
        background: radial-gradient(
          circle at 32% 28%,
          rgb(255 255 255 / 90%),
          var(--particle-color) 36%,
          var(--particle-color)
        );
        box-shadow:
          0 0 6px 1px var(--particle-color),
          0 0 14px 2px var(--particle-color);
        will-change: transform, opacity;
        animation: color-burst var(--burst-duration)
          cubic-bezier(0.12, 0.72, 0.3, 1) var(--burst-delay) both;
      }

      .color-explosion.is-static::before {
        animation: none;
        opacity: 0.18;
      }

      .color-explosion.is-static::after {
        animation: none;
      }

      .color-explosion.is-static .firework-ring {
        opacity: 0.25;
        transform: translate(-50%, -50%) scale(0.5);
        animation: none;
      }

      .color-explosion.is-static .explosion-particle {
        opacity: 0.8;
        animation: none;
      }

      @keyframes celebration-glow {
        from {
          opacity: 0.06;
          transform: rotate(0deg) scale(0.9);
        }

        to {
          opacity: 0.12;
          transform: rotate(24deg) scale(1.15);
        }
      }

      @keyframes celebration-night {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes ring-burst {
        from {
          opacity: 0.95;
          transform: translate(-50%, -50%) scale(0.01);
        }

        to {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      @keyframes color-burst {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.1);
        }

        65% {
          opacity: 1;
        }

        to {
          opacity: 0;
          transform: translate(
              calc(-50% + var(--burst-x)),
              calc(-50% + var(--burst-y))
            )
            scale(2.4);
        }
      }

      @media (hover: hover) and (pointer: fine) {
        .canvas {
          cursor: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }

        .color-cursor,
        .cursor-face {
          transition-duration: 0.01ms;
        }

        .cursor-trail {
          animation: trail-fade-reduced 1600ms ease-out forwards;
        }
      }
    </style>
  </head>
  <body>
    <main class="canvas" id="canvas">
      <div class="color-cursor" id="color-cursor" aria-hidden="true">
        <span class="cursor-face">
          <img class="cursor-selfie" alt="" draggable="false" />
          <span class="cursor-eye"></span>
          <span class="cursor-eye"></span>
          <span class="cursor-smile"></span>
        </span>
      </div>
    </main>
    <div class="camera-status" id="camera-status" role="status" aria-live="polite"></div>

    <script>
      const canvas = document.querySelector("#canvas");
      const colorCursor = document.querySelector("#color-cursor");
      const cursorSelfie = document.querySelector(".cursor-selfie");
      const cameraStatus = document.querySelector("#camera-status");
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const favicon = document.querySelector('link[rel="icon"]');
      const faviconCanvas = document.createElement("canvas");
      const faviconContext = faviconCanvas.getContext("2d");
      faviconCanvas.width = 32;
      faviconCanvas.height = 32;
      let activeReveal;
      let activeTouchPointerId;
      let lastTrailPoint;
      let cursorSize = 8;
      let clickCount = 0;
      let isExploding = false;
      let cameraCapturePending = false;
      let cameraGestureActive = false;
      let cameraStatusTimeout;
      const activeTouchPointers = new Set();
      const cameraGesturePointers = new Set();
      const suppressedCameraClickPointers = new Set();
      const trailMarks = new Set();

      function drawFavicon(hue) {
        faviconContext.clearRect(0, 0, faviconCanvas.width, faviconCanvas.height);
        faviconContext.fillStyle = `hsl(${hue} 72% 55%)`;
        faviconContext.beginPath();
        faviconContext.arc(16, 16, 14, 0, Math.PI * 2);
        faviconContext.fill();
        favicon.type = "image/png";
        favicon.href = faviconCanvas.toDataURL("image/png");
        colorCursor.style.backgroundColor = `hsl(${hue} 72% 55%)`;
      }

      let faviconStartHue = Math.random() * 360;
      let faviconTargetHue = Math.random() * 360;
      let faviconTransitionStarted = performance.now();
      let faviconTransitionDuration = 3500;

      drawFavicon(faviconStartHue);
      window.setInterval(() => {
        const now = performance.now();
        const progress = Math.min(
          (now - faviconTransitionStarted) / faviconTransitionDuration,
          1,
        );
        const hueDifference = ((faviconTargetHue - faviconStartHue + 540) % 360) - 180;
        const easedProgress = progress * progress * (3 - 2 * progress);
        drawFavicon((faviconStartHue + hueDifference * easedProgress + 360) % 360);

        if (progress === 1) {
          faviconStartHue = faviconTargetHue;
          faviconTargetHue = Math.random() * 360;
          faviconTransitionStarted = now;
          faviconTransitionDuration = 3000 + Math.random() * 3000;
        }
      }, 250);

      function toHex(hue, saturation, lightness) {
        const s = saturation / 100;
        const l = lightness / 100;
        const chroma = (1 - Math.abs(2 * l - 1)) * s;
        const x = chroma * (1 - Math.abs(((hue / 60) % 2) - 1));
        const offset = l - chroma / 2;
        const segments = [
          [chroma, x, 0],
          [x, chroma, 0],
          [0, chroma, x],
          [0, x, chroma],
          [x, 0, chroma],
          [chroma, 0, x],
        ];
        const [red, green, blue] = segments[Math.floor(hue / 60)].map((value) =>
          Math.round((value + offset) * 255),
        );
        return `#${[red, green, blue]
          .map((channel) => channel.toString(16).padStart(2, "0"))
          .join("")}`;
      }

      function updateColor(event) {
        if (isExploding) return;

        clickCount += 1;
        cursorSize += 3;
        colorCursor.style.width = `${cursorSize}px`;
        colorCursor.style.height = `${cursorSize}px`;

        if (clickCount >= 100) {
          startColorExplosion();
          return;
        }

        const isPastel = Math.random() < 0.35;
        const hue = Math.floor(Math.random() * 360);
        const saturation = isPastel
          ? 45 + Math.floor(Math.random() * 31)
          : 52 + Math.floor(Math.random() * 25);
        const lightness = isPastel
          ? 78 + Math.floor(Math.random() * 13)
          : 42 + Math.floor(Math.random() * 25);
        const color = toHex(hue, saturation, lightness);
        const cssColor = `hsl(${hue} ${saturation}% ${lightness}%)`;
        themeColor.setAttribute("content", color);

        if (activeReveal) {
          canvas.style.backgroundColor = activeReveal.cssColor;
          activeReveal.animation.cancel();
          activeReveal.element.remove();
          activeReveal = undefined;
        }

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          canvas.style.backgroundColor = cssColor;
          return;
        }

        const x = event.clientX;
        const y = event.clientY;
        const radius = Math.hypot(
          Math.max(x, window.innerWidth - x),
          Math.max(y, window.innerHeight - y),
        );
        const reveal = document.createElement("div");
        reveal.className = "color-reveal";
        reveal.style.backgroundColor = cssColor;
        reveal.style.width = `${radius * 2}px`;
        reveal.style.height = `${radius * 2}px`;
        reveal.style.left = `${x - radius}px`;
        reveal.style.top = `${y - radius}px`;
        document.body.append(reveal);

        const animation = reveal.animate(
          [
            { transform: "scale(0.0005)" },
            { transform: "scale(1)" },
          ],
          { duration: 750, easing: "ease-out" },
        );
        const revealState = { animation, cssColor, element: reveal };
        activeReveal = revealState;
        animation.onfinish = () => {
          if (activeReveal !== revealState) return;
          canvas.style.backgroundColor = cssColor;
          reveal.remove();
          activeReveal = undefined;
        };
      }

      function startColorExplosion() {
        isExploding = true;
        colorCursor.classList.remove("is-visible", "has-smile");
        const explosion = document.createElement("div");
        explosion.className = "color-explosion";
        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        const burstCount = 30;
        const particlesPerBurst = 64;
        const screenDiagonal = Math.hypot(window.innerWidth, window.innerHeight);

        for (let burst = 0; burst < burstCount; burst += 1) {
          const burstColumn = burst % 6;
          const burstRow = Math.floor(burst / 6);
          const burstOriginX = burstColumn * (100 / 6) + 5 + Math.random() * 7;
          const burstOriginY = burstRow * 20 + 5 + Math.random() * 8;
          const burstHue = Math.random() * 360;
          const burstDelay = `${burst * 190}ms`;
          const firework = document.createElement("div");
          const ring = document.createElement("div");
          firework.className = "firework-burst";
          firework.style.setProperty(
            "--origin-x",
            `${reducedMotion ? 5 + Math.random() * 90 : burstOriginX}%`,
          );
          firework.style.setProperty(
            "--origin-y",
            `${reducedMotion ? 5 + Math.random() * 90 : burstOriginY}%`,
          );
          ring.className = "firework-ring";
          ring.style.setProperty("--burst-color", `hsl(${burstHue} 100% 65%)`);
          ring.style.setProperty("--burst-delay", burstDelay);
          firework.append(ring);

          for (
            let particleIndex = 0;
            particleIndex < particlesPerBurst;
            particleIndex += 1
          ) {
            const angle =
              (particleIndex / particlesPerBurst) * Math.PI * 2 +
              (Math.random() - 0.5) * 0.36;
            const distance = screenDiagonal * (0.4 + Math.random() * 0.8);
            const particle = document.createElement("div");
            const hue = (burstHue + (Math.random() - 0.5) * 110 + 360) % 360;
            particle.className = "explosion-particle";
            particle.style.setProperty(
              "--particle-color",
              `hsl(${hue} ${90 + Math.random() * 10}% ${52 + Math.random() * 18}%)`,
            );
            particle.style.setProperty("--particle-size", `${8 + Math.random() * 20}px`);
            particle.style.setProperty("--burst-x", `${Math.cos(angle) * distance}px`);
            particle.style.setProperty("--burst-y", `${Math.sin(angle) * distance}px`);
            particle.style.setProperty("--burst-delay", burstDelay);
            particle.style.setProperty(
              "--burst-duration",
              `${3000 + Math.random() * 1000}ms`,
            );

            firework.append(particle);
          }

          if (reducedMotion) explosion.classList.add("is-static");
          explosion.append(firework);
        }

        document.body.append(explosion);
        window.setTimeout(() => {
          explosion.remove();
          cursorSize = 8;
          clickCount = 0;
          colorCursor.style.width = "8px";
          colorCursor.style.height = "8px";
          isExploding = false;
        }, 10000);
      }

      function positionCursor(event) {
        const touchOffset = event.pointerType === "touch" ? 50 : 0;
        colorCursor.style.left = `${event.clientX}px`;
        colorCursor.style.top = `${event.clientY - touchOffset}px`;
        colorCursor.classList.add("is-visible");
      }

      function showCameraError(error) {
        console.error("Unable to capture a cursor selfie:", error);
        cameraStatus.textContent =
          "Camera unavailable. Allow camera access and try again.";
        cameraStatus.classList.add("is-visible");
        window.clearTimeout(cameraStatusTimeout);
        cameraStatusTimeout = window.setTimeout(() => {
          cameraStatus.classList.remove("is-visible");
        }, 4000);
      }

      async function captureCursorSelfie() {
        if (cameraCapturePending) return;
        cameraCapturePending = true;
        let stream;
        let video;

        try {
          if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("Camera access requires a secure browser context.");
          }

          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "user" } },
            audio: false,
          });
          video = document.createElement("video");
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          video.srcObject = stream;
          video.style.position = "fixed";
          video.style.width = "1px";
          video.style.height = "1px";
          video.style.opacity = "0";
          video.style.pointerEvents = "none";
          document.body.append(video);
          await video.play();

          if (!video.videoWidth) {
            await new Promise((resolve, reject) => {
              video.addEventListener("loadeddata", resolve, { once: true });
              video.addEventListener(
                "error",
                () => reject(new Error("The camera did not provide an image.")),
                { once: true },
              );
            });
          }

          const photo = document.createElement("canvas");
          photo.width = video.videoWidth;
          photo.height = video.videoHeight;
          const photoContext = photo.getContext("2d");
          if (!photoContext) throw new Error("Could not prepare the camera image.");
          photoContext.drawImage(video, 0, 0);
          cursorSelfie.src = photo.toDataURL("image/jpeg", 0.88);
          colorCursor.classList.add("has-selfie");
          cameraStatus.classList.remove("is-visible");
        } catch (error) {
          showCameraError(error);
        } finally {
          stream?.getTracks().forEach((track) => track.stop());
          if (video) {
            video.pause();
            video.srcObject = null;
            video.remove();
          }
          cameraCapturePending = false;
        }
      }

      function resetActiveTouchGesture() {
        activeTouchPointers.clear();
        cameraGesturePointers.clear();
        cameraGestureActive = false;
        activeTouchPointerId = undefined;
        lastTrailPoint = undefined;
        colorCursor.classList.remove("has-smile", "is-visible");
      }

      function leaveTrail(event) {
        if (
          event.pointerType === "touch" &&
          event.pointerId !== activeTouchPointerId
        ) {
          return;
        }

        const point = { x: event.clientX, y: event.clientY };
        if (
          lastTrailPoint &&
          Math.hypot(point.x - lastTrailPoint.x, point.y - lastTrailPoint.y) < 12
        ) {
          return;
        }
        lastTrailPoint = point;

        const [red, green, blue] = getComputedStyle(canvas)
          .backgroundColor.match(/\d+(?:\.\d+)?/g)
          .slice(0, 3)
          .map(Number);
        const mark = document.createElement("div");
        mark.className = "cursor-trail";
        mark.style.backgroundColor = `rgb(${255 - red} ${255 - green} ${255 - blue})`;
        mark.style.setProperty("--trail-size", `${cursorSize}px`);
        mark.style.left = `${point.x}px`;
        mark.style.top = `${point.y}px`;
        document.body.append(mark);
        trailMarks.add(mark);

        if (trailMarks.size > 80) {
          const oldestMark = trailMarks.values().next().value;
          oldestMark.remove();
          trailMarks.delete(oldestMark);
        }

        mark.addEventListener(
          "animationend",
          () => {
            trailMarks.delete(mark);
            mark.remove();
          },
          { once: true },
        );
      }

      canvas.addEventListener("pointermove", (event) => {
        positionCursor(event);
        leaveTrail(event);
      });
      canvas.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") {
          activeTouchPointers.add(event.pointerId);
          activeTouchPointerId = event.pointerId;
          lastTrailPoint = undefined;
          canvas.setPointerCapture(event.pointerId);

          if (activeTouchPointers.size === 3 && !cameraGestureActive) {
            cameraGestureActive = true;
            activeTouchPointers.forEach((pointerId) => {
              cameraGesturePointers.add(pointerId);
              suppressedCameraClickPointers.add(pointerId);
              window.setTimeout(() => {
                suppressedCameraClickPointers.delete(pointerId);
              }, 1000);
            });
            void captureCursorSelfie();
          }
        }
        positionCursor(event);
        colorCursor.classList.add("has-smile");
      });
      function endPointer(event) {
        if (event.pointerType === "touch") {
          activeTouchPointers.delete(event.pointerId);
          cameraGesturePointers.delete(event.pointerId);
          if (event.pointerId === activeTouchPointerId) {
            activeTouchPointerId = activeTouchPointers.values().next().value;
          }
          if (cameraGesturePointers.size === 0) {
            cameraGestureActive = false;
          }
          if (activeTouchPointers.size === 0) {
            colorCursor.classList.remove("has-smile");
            colorCursor.classList.remove("is-visible");
            lastTrailPoint = undefined;
          }
        } else {
          colorCursor.classList.remove("has-smile");
        }

        if (event.pointerType === "touch" && activeTouchPointers.size === 0) {
          lastTrailPoint = undefined;
        }
      }

      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);
      window.addEventListener("blur", resetActiveTouchGesture);
      canvas.addEventListener("pointerleave", (event) => {
        if (
          event.pointerType === "touch" &&
          activeTouchPointers.has(event.pointerId)
        ) {
          return;
        }
        lastTrailPoint = undefined;
        colorCursor.classList.remove("is-visible");
        colorCursor.classList.remove("has-smile");
      });
      canvas.addEventListener("click", (event) => {
        if (
          event.pointerType === "touch" &&
          suppressedCameraClickPointers.delete(event.pointerId)
        ) {
          return;
        }
        updateColor(event);
      });
    </script>
  </body>
</html>
